# 全局 WebSocket 支持（必须放在最顶部，所有配置共用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 前端站点配置 - www.adnaan.cn
server {
    listen 80;
    server_name www.adnaan.site adnaan.site;

    # 前端打包好的静态文件目录
    root /usr/share/nginx/html/blog;
    index index.html;

    # 通用安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------
    # WebSocket / Socket.IO 代理
    # ------------------------------
    location /socket.io/ {
        proxy_pass http://blog-backend:8200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 跨域
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ------------------------------
    # 静态资源缓存（js/css/img/font）
    # ------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------
    # 前端 SPA 路由（Vue/React）
    # ------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ------------------------------
    # API 转发到后端
    # ------------------------------
    location /api/ {
        proxy_pass http://blog-backend:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ------------------------------
    # 上传文件代理
    # ------------------------------
    location /uploads/ {
        proxy_pass http://blog-backend:8200/uploads/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------
    # 健康检查
    # ------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}