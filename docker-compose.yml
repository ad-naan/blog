version: '3.8'

# 接入公共网络（固定，所有项目都一样）
networks:
  default:
    external: true
    name: base-service_base-net

services:
  # 后端服务
  blog-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: always
    # 安全：不对外暴露端口，只内网访问
    # ports:
    #   - "8200:8200"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production

      # ======================
      # 公共 MySQL（新密码）
      # ======================
      DB_HOST: base-mysql
      DB_PORT: 3306
      DB_NAME: blog_prod
      DB_USER: root
      DB_PASSWORD: du@adnaan#328

      # ======================
      # 公共 Redis（新密码）
      # ======================
      REDIS_HOST: base-redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      REDIS_PASSWORD: du@adnaan#328

    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads

    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const options = { hostname: 'localhost', port: 8200, path: '/api/system/health', timeout: 3000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # 前端构建（打包后直接输出到公共 Nginx）
  blog-frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://www.adnaan.site}
        VITE_SOCKET_WS_URL: ${VITE_SOCKET_WS_URL:-ws://www.adnaan.site}
        VITE_SOCKET_IO_AUTH_KEY: ${VITE_SOCKET_IO_AUTH_KEY:-duyong-socket-328}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-博客系统}
        VITE_APP_DESCRIPTION: ${VITE_APP_DESCRIPTION:-基于Node.js的现代化博客系统}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_APP_AUTHOR: ${VITE_APP_AUTHOR:-adnaan}
    container_name: blog-frontend-builder
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /home/adnaan/project/base-service/nginx/html/blog:/output